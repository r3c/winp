name: Verify

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "50 4 * * *"

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  check:
    name: Check style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - run: dotnet format --no-restore --verify-no-changes src/Winp.sln

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - run: dotnet build src/Winp.sln

  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: ${{ always() }}

    needs:
      - build
      - check

    steps:
      - name: Check validation results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | jq -e 'all(.result == "success")'
